<style>
/* Layout: um app de tela cheia pro celular — foto em cima, alternativas no polegar.
   Visual de cartão-postal noturno: papel creme sobre mata escura, carimbos de correio. */
:root {
  --mata: #0e2a2b;        /* fundo: verde-mata à noite */
  --mata-2: #163b3c;
  --papel: #fff3dd;       /* cartão-postal */
  --tinta: #1e1a16;
  --manga: #ffb627;
  --hibisco: #ff5d73;
  --jade: #2ec4b6;
  --mar: #4d8dff;
  --certo: #36d27a;
  --errado: #ff4d4d;
  --muted: #9fbab6;
  --font-display: "Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --font-stamp: "Rubik Mono One", "Arial Black", Impact, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--mata);
  background-image:
    radial-gradient(circle at 15% 0%, #1f4d47 0, transparent 45%),
    radial-gradient(circle at 100% 100%, #2a2440 0, transparent 50%);
  color: var(--papel);
  font-family: var(--font-display);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--manga); outline-offset: 2px; }
input { font: inherit; }

#app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  max-width: 980px; margin: 0 auto;
}
.scroll { overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 16px; }

/* ---------- topo ---------- */
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.logo .pin { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--hibisco); box-shadow: inset 0 0 0 6px var(--hibisco), inset 0 0 0 11px var(--papel); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--mata-2); display: grid; place-items: center; font-size: 1.1rem; }

/* ---------- capa / entrada ---------- */
.hero { padding-block: 28px 8px; }
.hero h1 { font-size: clamp(2.6rem, 13vw, 4.6rem); line-height: 0.92; margin: 0; letter-spacing: -0.04em; font-weight: 800; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--manga); }
.hero p { color: var(--muted); max-width: 34ch; margin: 14px 0 0; line-height: 1.45; }
.postcards { display: flex; gap: 10px; margin: 22px 0 6px; height: 120px; }
.postcards div { flex: 1; border-radius: 6px; background-size: cover; background-position: center; border: 5px solid var(--papel); box-shadow: 0 8px 20px #0007; }
.postcards div:nth-child(1) { transform: rotate(-4deg); }
.postcards div:nth-child(2) { transform: rotate(2deg) translateY(6px); }
.postcards div:nth-child(3) { transform: rotate(-1deg); }

.field { display: grid; gap: 8px; margin-top: 18px; }
.field label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
.field input { width: 100%; padding: 16px; border-radius: var(--r); border: 2px solid #ffffff22; background: #00000033; color: var(--papel); font-size: 1.25rem; font-weight: 600; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; }
.swatch[aria-pressed="true"] { border-color: var(--papel); transform: scale(1.1); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 22px; border-radius: 999px; font-weight: 800; font-size: 1.1rem; background: var(--manga); color: var(--tinta); box-shadow: 0 5px 0 #b67a00; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b67a00; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--mata-2); color: var(--papel); box-shadow: 0 5px 0 #071a1b; }
.btn.ghost:active { box-shadow: 0 1px 0 #071a1b; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.note { color: var(--muted); font-size: .9rem; line-height: 1.45; }

/* ---------- lobby ---------- */
.section-title { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; margin: 22px 0 10px; }
.players { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--mata-2); font-weight: 600; animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
.chip .you { font-size: .72rem; color: var(--muted); font-weight: 400; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--tinta); flex: none; font-size: .9rem; }
.seg { display: flex; background: #00000040; border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { flex: 1; padding: 10px 8px; border-radius: 999px; font-weight: 600; color: var(--muted); font-size: .95rem; }
.seg button[aria-pressed="true"] { background: var(--papel); color: var(--tinta); }
.setting { display: grid; gap: 8px; margin-top: 14px; }
.setting > span { font-weight: 600; }
.setting small { color: var(--muted); }
.banner { margin-top: 14px; padding: 12px 14px; border-radius: var(--r); background: #ffb62718; border: 1px dashed #ffb62766; color: var(--papel); font-size: .92rem; line-height: 1.4; }

/* ---------- jogo ---------- */
.game { flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
.hud { display: flex; align-items: center; gap: 10px; }
.round-tag { font-family: var(--font-stamp); font-size: .8rem; letter-spacing: .04em; background: var(--papel); color: var(--tinta); padding: 6px 10px; border-radius: 6px; }
.diff { color: var(--manga); font-size: .9rem; letter-spacing: 2px; }
.x2 { font-family: var(--font-stamp); font-size: .75rem; background: var(--hibisco); color: var(--tinta); padding: 5px 8px; border-radius: 6px; animation: wiggle 1s infinite; }
.hud .grow { flex: 1; }
.timer { font-family: var(--font-stamp); font-size: 1.1rem; min-width: 2.4ch; text-align: right; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--hibisco); animation: pulse .5s infinite alternate; }
.bar { height: 6px; border-radius: 3px; background: #ffffff1a; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--manga); transform-origin: left; }

.photo-wrap { position: relative; min-height: 0; border-radius: 10px; background: var(--papel); padding: 7px 7px 26px; box-shadow: 0 14px 30px #0009; transform: rotate(-0.6deg); }
.photo { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 4px; background: #233; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; animation: kenburns 24s ease-out forwards; }
.photo-wrap .caption { position: absolute; left: 12px; right: 12px; bottom: 4px; color: #6d6253; font-size: .78rem; display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; overflow: hidden; }
.photo-wrap .caption span:last-child { overflow: hidden; text-overflow: ellipsis; }
.postmark { position: absolute; top: 10px; right: 12px; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #1e1a1688; color: #1e1a16aa; display: grid; place-items: center; text-align: center; font-family: var(--font-stamp); font-size: .55rem; line-height: 1.2; background: #fff3dd66; backdrop-filter: blur(2px); transform: rotate(12deg); }

.countdown { position: absolute; inset: 0; display: grid; place-items: center; background: var(--mata-2); border-radius: 4px; text-align: center; }
.countdown b { font-family: var(--font-stamp); font-size: clamp(4rem, 26vw, 9rem); color: var(--manga); animation: pop .5s; display: block; }
.countdown span { color: var(--muted); font-weight: 600; }

.stamp { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) rotate(-12deg); font-family: var(--font-stamp); font-size: clamp(1.6rem, 9vw, 3.2rem); padding: 8px 18px; border: 5px solid currentColor; border-radius: 10px; text-align: center; line-height: 1.05; mix-blend-mode: normal; background: #fff3ddd9; animation: stamp .45s cubic-bezier(.2,1.8,.4,1) both; white-space: nowrap; }
.stamp small { display: block; font-size: .45em; letter-spacing: .05em; }
.stamp.ok { color: #12893f; }
.stamp.bad { color: #d62f2f; }
.stamp.none { color: #6d6253; }

.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { position: relative; min-height: 76px; padding: 12px 12px 12px 14px; border-radius: var(--r); text-align: left; color: var(--tinta); font-weight: 800; font-size: clamp(1rem, 4.4vw, 1.25rem); line-height: 1.1; display: flex; flex-direction: column; justify-content: center; gap: 3px; box-shadow: 0 5px 0 #0006; transition: transform .25s, opacity .35s, filter .35s, box-shadow .1s; overflow: hidden; }
.opt:active { transform: translateY(3px); box-shadow: 0 2px 0 #0006; }
.opt .uf { font-family: var(--font-stamp); font-size: .7rem; font-weight: 400; opacity: .7; }
.opt:nth-child(1) { background: var(--manga); }
.opt:nth-child(2) { background: var(--jade); }
.opt:nth-child(3) { background: var(--hibisco); }
.opt:nth-child(4) { background: var(--mar); }
.options.locked .opt:not(.mine) { opacity: .35; filter: saturate(.4); }
.opt.mine { outline: 4px solid var(--papel); outline-offset: 2px; }
.opt.right { animation: right .7s cubic-bezier(.3,1.6,.5,1) both; outline: 4px solid var(--certo); outline-offset: 2px; opacity: 1 !important; filter: none !important; }
.opt.wrong { opacity: .28 !important; filter: grayscale(1) !important; transform: scale(.95); }
.opt .who { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.opt .who .av { width: 24px; height: 24px; font-size: .72rem; box-shadow: 0 0 0 2px #0005; animation: drop .4s cubic-bezier(.3,1.6,.5,1) both; }

.answered { display: flex; gap: 6px; align-items: center; min-height: 30px; flex-wrap: wrap; }
.answered .av { opacity: .35; transition: opacity .3s, transform .3s; }
.answered .av.done { opacity: 1; transform: scale(1.08); box-shadow: 0 0 0 2px var(--certo); }
.answered small { color: var(--muted); margin-left: 4px; }

/* ---------- revelação ---------- */
.flash { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; pointer-events: none; }
.flash b { font-family: var(--font-stamp); font-size: clamp(1.6rem, 8vw, 3rem); color: var(--tinta); background: var(--manga); padding: 14px 22px; border-radius: 12px; transform: rotate(-3deg); animation: flash 1.2s ease-in-out both; text-align: center; box-shadow: 0 10px 40px #000a; }

.reveal-card { background: var(--papel); color: var(--tinta); border-radius: var(--r); padding: 14px 16px; animation: slideup .5s cubic-bezier(.2,1.2,.4,1) both; }
.reveal-card .where { font-weight: 800; font-size: 1.5rem; letter-spacing: -.02em; line-height: 1.05; }
.reveal-card .where small { font-family: var(--font-stamp); font-size: .8rem; background: var(--tinta); color: var(--papel); padding: 2px 6px; border-radius: 4px; vertical-align: middle; margin-left: 4px; }
.reveal-card .what { font-weight: 600; margin-top: 4px; color: #5b4f40; }
.reveal-card p { margin: 8px 0 0; line-height: 1.4; font-size: .95rem; }
.reveal-card .credit { margin-top: 8px; font-size: .7rem; color: #8a7c69; }
.reveal-card .credit a { color: inherit; }

.board { display: grid; gap: 6px; margin-top: 10px; }
.board .line { display: grid; grid-template-columns: 26px 30px 1fr auto auto; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 12px; background: var(--mata-2); transition: transform .5s cubic-bezier(.3,1.3,.5,1); }
.board .line.me { box-shadow: inset 0 0 0 2px var(--manga); }
.board .pos { font-family: var(--font-stamp); color: var(--muted); font-size: .85rem; text-align: center; }
.board .name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .name small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; white-space: normal; }
.board .delta { font-family: var(--font-stamp); font-size: .8rem; color: var(--certo); animation: drop .5s both; }
.board .delta.zero { color: var(--muted); }
.board .score { font-family: var(--font-stamp); font-variant-numeric: tabular-nums; min-width: 5ch; text-align: right; }

.footer-actions { display: flex; gap: 10px; align-items: center; }
.footer-actions .btn { flex: 1; }
.auto { color: var(--muted); font-size: .85rem; text-align: center; }

.reacts { display: flex; gap: 6px; justify-content: center; }
.reacts button { font-size: 1.35rem; width: 44px; height: 40px; border-radius: 12px; background: var(--mata-2); }
.reacts button:active { transform: scale(.9); }
.float-emoji { position: fixed; z-index: 40; font-size: 2.4rem; pointer-events: none; animation: floatup 2.2s ease-out forwards; text-align: center; }
.float-emoji small { display: block; font-size: .8rem; font-weight: 700; color: var(--papel); text-shadow: 0 1px 3px #000; }

/* ---------- final ---------- */
.podium { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; gap: 8px; margin-top: 24px; }
.podium .step { text-align: center; animation: rise .8s cubic-bezier(.2,1.3,.4,1) both; }
.podium .block { border-radius: 10px 10px 0 0; background: var(--papel); color: var(--tinta); font-family: var(--font-stamp); display: grid; place-items: center; font-size: 1.6rem; }
.podium .av { width: 54px; height: 54px; margin: 0 auto 6px; font-size: 1.3rem; }
.podium .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podium .pts { font-family: var(--font-stamp); font-size: .8rem; color: var(--manga); margin-bottom: 6px; }
.awards { display: grid; gap: 8px; margin-top: 18px; }
.award { display: flex; gap: 12px; align-items: center; background: var(--mata-2); border-radius: 12px; padding: 10px 12px; }
.award b { font-size: 1.6rem; }
.award div { line-height: 1.25; }
.award small { color: var(--muted); display: block; }
canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* mesa (um celular só) */
.toggle-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.toggle { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; background: var(--mata-2); font-weight: 700; text-align: left; }
.toggle[aria-pressed="true"] { background: var(--certo); color: var(--tinta); }

@media (min-width: 760px) {
  .game.wide { grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .game.wide .hud { grid-column: 1 / -1; }
  .game.wide .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; }
  .game.wide .options { grid-template-columns: 1fr; }
}
.side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.side.scroll { padding: 6px 6px 0; margin: -6px -6px 0; }
@media (max-width: 759px) {
  .game { grid-template-rows: auto minmax(150px, 1fr) auto; }
  .side.scroll { max-height: 58dvh; }
}

@keyframes kenburns { from { transform: scale(1.0) translate(0, 0); } to { transform: scale(1.18) translate(-2%, -2%); } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@keyframes drop { from { transform: translateY(-14px) scale(.6); opacity: 0; } }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-12deg) scale(2.6); opacity: 0; } 60% { opacity: 1; } }
@keyframes right { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes slideup { from { transform: translateY(30px); opacity: 0; } }
@keyframes flash { 0% { transform: rotate(-3deg) scale(.4); opacity: 0; } 20% { transform: rotate(-3deg) scale(1.08); opacity: 1; } 80% { transform: rotate(-3deg) scale(1); opacity: 1; } 100% { transform: rotate(-3deg) scale(1.2); opacity: 0; } }
@keyframes floatup { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translateY(-20px) scale(1.1); } 100% { transform: translateY(-46vh) scale(1); opacity: 0; } }
@keyframes wiggle { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@keyframes pulse { to { transform: scale(1.15); } }
@keyframes rise { from { transform: translateY(60px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<script>
"use strict";
// ======================================================================
// Dados
// ======================================================================
const PLACES = /*__PLACES__*/[];
const REGION = { AC:"N",AP:"N",AM:"N",PA:"N",RO:"N",RR:"N",TO:"N", AL:"NE",BA:"NE",CE:"NE",MA:"NE",PB:"NE",PE:"NE",PI:"NE",RN:"NE",SE:"NE", DF:"CO",GO:"CO",MT:"CO",MS:"CO", ES:"SE",MG:"SE",RJ:"SE",SP:"SE", PR:"S",RS:"S",SC:"S" };

// Cada "lugar de resposta" (cidade ou região) vira uma alternativa possível.
const LOCS = [];
const locIndex = new Map();
for (const p of PLACES) {
  const key = p.w + "|" + p.uf;
  if (!locIndex.has(key)) { locIndex.set(key, LOCS.length); LOCS.push({ w: p.w, uf: p.uf, reg: REGION[p.uf] || "?", n: 0, u: 0 }); }
  p.loc = locIndex.get(key);
  LOCS[p.loc][p.t === "n" ? "n" : "u"]++;
}
for (const l of LOCS) l.kind = l.n > l.u ? "n" : "u";

const COLORS = ["#ffb627", "#2ec4b6", "#ff5d73", "#4d8dff", "#b388ff", "#a3e635", "#ff8a3d", "#f472b6"];
const MODES = {
  tranquilo: { label: "Tranquilo", hint: "mais lugares conhecidos", mix: [0.55, 0.35, 0.10], near: 0.3, noise: 3 },
  misto:     { label: "Misto", hint: "começa fácil e esquenta", mix: [0.30, 0.40, 0.30], near: 1.4, noise: 2 },
  raiz:      { label: "Raiz", hint: "pra quem já rodou o Brasil", mix: [0.10, 0.35, 0.55], near: 2.2, noise: 1.5 },
};
const ROUNDS = [8, 12, 16];
const SECONDS = [15, 20, 30];
const REVEAL_MS = 15000;
const LEAD_FIRST = 3200, LEAD = 1800;
const DIFF_MULT = { 1: 1, 2: 1.2, 3: 1.5 };

// ======================================================================
// Utilidades
// ======================================================================
const $ = (s, el = document) => el.querySelector(s);
const rid = (n = 8) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const initial = name => (name || "?").trim().charAt(0).toUpperCase();
const imgUrl = p => "img/" + p.id + ".jpg";
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}
const av = (name, color, cls = "") => h("span", { class: "av " + cls, style: `background:${color}` }, initial(name));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------- som (sintetizado, liga no primeiro toque) ----------
const sound = {
  on: store.get("oei:sound") !== false, ctx: null,
  ensure() { if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} if (this.ctx?.state === "suspended") this.ctx.resume(); },
  tone(freq, dur = 0.12, type = "sine", gain = 0.12, when = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  tick() { this.tone(880, 0.05, "square", 0.04); },
  tap() { this.tone(520, 0.08, "triangle", 0.1); },
  drum() { for (let i = 0; i < 9; i++) this.tone(140 + i * 8, 0.06, "triangle", 0.12, i * (0.11 - i * 0.008)); },
  good() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, "triangle", 0.12, 0.08 * i)); },

// ======================================================================
// Regras: sorteio, alternativas e pontuação
// ======================================================================
function pickPlaces(modeKey, rounds, avoid) {
  const mode = MODES[modeKey];
  const want = [Math.round(rounds * mode.mix[0]), Math.round(rounds * mode.mix[1])];
  want.push(rounds - want[0] - want[1]);
  const chosen = [], usedLocs = new Set();
  const take = (pool, n) => {
    const fresh = shuffle(pool.filter(i => !avoid.has(i))), stale = shuffle(pool.filter(i => avoid.has(i)));
    for (const i of [...fresh, ...stale]) {
      if (n <= 0) break;
      if (chosen.includes(i) || usedLocs.has(PLACES[i].loc)) continue;
      chosen.push(i); usedLocs.add(PLACES[i].loc); n--;
    }
  };
  const all = PLACES.map((_, i) => i);
  [1, 2, 3].forEach((d, k) => take(all.filter(i => PLACES[i].d === d), want[k]));
  if (chosen.length < rounds) take(all, rounds - chosen.length);
  return shuffle(chosen).sort((a, b) => PLACES[a].d - PLACES[b].d);
}

// Alternativas erradas: no modo misto/raiz, puxa lugares da mesma região
// e do mesmo "tipo" (praia/natureza x cidade) pra confundir de verdade.
function buildOptions(pi, modeKey) {
  const mode = MODES[modeKey], p = PLACES[pi], L = LOCS[p.loc];
  const others = LOCS.map((_, i) => i).filter(i => i !== p.loc).map(i => ({
    i, s: (LOCS[i].reg === L.reg ? mode.near : 0) + (LOCS[i].kind === L.kind ? 0.8 : 0) + Math.random() * mode.noise,
  }));
  others.sort((a, b) => b.s - a.s);
  const opts = shuffle([p.loc, ...others.slice(0, 3).map(o => o.i)]);
  return { o: opts, c: opts.indexOf(p.loc) };
}

// Acerto: 500–1000 pela rapidez × dificuldade. +50/acerto seguido (máx +200),
// +250 se só uma pessoa acertou, e a última rodada vale dobrado.
function scoreRound({ c, d, x2 }, durMs, answers, participants, streaks) {
  const res = {};
  const rightIds = participants.filter(id => answers[id]?.c === c);
  const lone = participants.length >= 2 && rightIds.length === 1;
  let fastest = null;
  for (const id of rightIds) if (!fastest || answers[id].ms < answers[fastest].ms) fastest = id;
  for (const id of participants) {
    const a = answers[id];
    if (!a || a.c !== c) { streaks[id] = 0; res[id] = [a ? a.c : -1, 0, []]; continue; }
    const bonus = [];
    let pts = (500 + 500 * clamp(1 - a.ms / durMs, 0, 1)) * DIFF_MULT[d];
    if (d === 3) bonus.push("💎 difícil");
    if (id === fastest && rightIds.length > 1) bonus.push("⚡ mais rápido");
    const st = (streaks[id] || 0) + 1; streaks[id] = st;
    if (st >= 2) { pts += Math.min(st - 1, 4) * 50; bonus.push(`🔥 ${st} seguidas`); }
    if (lone) { pts += 250; bonus.push("🎯 só você!"); }
    if (x2) { pts *= 2; bonus.push("×2"); }
    res[id] = [a.c, Math.round(pts / 10) * 10, bonus];
  }
  return res;
}

// Jogadores = quem está com a página aberta e já escolheu nome.
function onlinePlayers() {
  const byPid = new Map();
  for (const peer of S.peers) {
    const pr = peer.presence || {};
    if (typeof pr.pid !== "string" || typeof pr.name !== "string" || !pr.name) continue;
    const prev = byPid.get(pr.pid);
    if (!prev || peer.updatedAt > prev.updatedAt) byPid.set(pr.pid, { pid: pr.pid, name: String(pr.name).slice(0, 18), color: /^#[0-9a-f]{6}$/i.test(pr.color) ? pr.color : "#999999", peer, updatedAt: peer.updatedAt });
  }
  if (S.joined && !byPid.has(S.me.pid)) byPid.set(S.me.pid, { pid: S.me.pid, name: S.me.name, color: S.me.color, peer: null });
  return [...byPid.values()];
}

// ======================================================================
// Rede (room do Artifact). Quem comanda publica o jogo na própria presença.
// ======================================================================
async function connect() {
  let room = null;
  try { room = await window.claude?.use?.("room"); } catch {}
  if (!room) { S.roomState = "off"; render(); return; }
  S.room = room;
  room.onConnection(ok => { S.roomState = ok ? "on" : (S.roomState === "on" ? "connecting" : S.roomState); render(); },
    () => { S.roomState = "off"; render(); });
  room.onPeers(ch => { S.peers = ch.peers; onPeersChanged(); }, () => { S.roomState = "off"; render(); });
  setTimeout(() => { if (S.roomState === "connecting" && !room.connected()) { S.roomState = "off"; render(); } }, 9000);
}
function setPresence(patch) { S.room?.presence(patch).catch(() => {}); }
function announce() { if (S.joined) setPresence({ pid: S.me.pid, name: S.me.name, color: S.me.color }); }

function onPeersChanged() {
  // reações
  for (const peer of S.peers) {
    const rx = peer.presence?.rx;
    if (!rx || typeof rx.k !== "number" || peer.sameTab) continue;
    const last = S.seenRx.get(peer.peer);
    S.seenRx.set(peer.peer, rx.k);
    if (last !== undefined && last !== rx.k) floatEmoji(rx.e, peer.presence.name);
  }
  // jogo canônico: o mais recente entre quem está comandando
  let best = null, bestPeer = null;
  for (const peer of S.peers) {
    const g = peer.presence?.g;
    if (!g || typeof g.id !== "string" || peer.sameTab) continue;
    if (!best || g.t > best.t || (g.t === best.t && peer.peer > bestPeer.peer)) { best = g; bestPeer = peer; }
  }
  if (S.host) {
    if (best && best.t > S.host.t) { stopHosting(); }   // outra pessoa começou depois: segue a dela
    else { hostCollect(); render(); return; }
  }
  receiveGame(best, bestPeer);
}

function receiveGame(g, peer) {
  const prev = S.g;
  S.g = g; S.gFrom = peer;
  if (g) {
    const key = g.id + ":" + g.i + ":" + g.ph;
    if (!S.local[key]) {
      const now = performance.now();
      S.local[key] = { at: now, showAt: now + (g.st || 0), deadline: now + (g.rem || 0), advAt: now + (g.adv || 0) };
    }
    if (S.joined && S.screen !== "mesa") S.screen = "game";
  } else if (prev && S.screen === "game") {
    S.screen = "lobby";
    toast(prev.ph === "f" ? "" : "Quem comandava a partida saiu. Comecem outra!");
  }
  render();
}

// ======================================================================
// Motor de quem comanda
// ======================================================================
function startHosting() {
  const set = { ...S.settings };
  if (PLACES.length - S.usedPlaces.size < set.rounds) S.usedPlaces.clear();
  const list = pickPlaces(set.mode, set.rounds, S.usedPlaces);
  list.forEach(i => S.usedPlaces.add(i));
  store.set("oei:used", [...S.usedPlaces]);
  S.host = { id: rid(6), t: Date.now(), set, list, i: -1, ph: "q", sc: {}, streaks: {}, answers: {}, part: [], q: null, startAt: 0, deadline: 0, advAt: 0, res: null, reason: "", timer: null, v: 0 };
  hostNext();
}
function stopHosting() {
  if (!S.host) return;
  clearTimeout(S.host.timer);
  S.host = null;
  setPresence({ g: null });
}
function ensureScores() {
  for (const p of onlinePlayers()) {
    const s = S.host.sc[p.pid];
    if (!s) S.host.sc[p.pid] = [p.name, p.color, 0, 0, 0];
    else { s[0] = p.name; s[1] = p.color; }
  }
}
function hostNext() {
  const H = S.host;
  clearTimeout(H.timer);
  if (H.i + 1 >= H.list.length) { H.ph = "f"; hostPublish(); return; }
  H.i++;
  const pi = H.list[H.i];
  const { o, c } = buildOptions(pi, H.set.mode);
  H.q = { pi, o, c, d: PLACES[pi].d, x2: H.i === H.list.length - 1 && H.list.length >= 5 };
  const lead = H.i === 0 ? LEAD_FIRST : LEAD;
  H.startAt = Date.now() + lead;
  H.deadline = H.startAt + H.set.seconds * 1000;
  H.answers = {}; H.res = null; H.ph = "q";
  ensureScores();
  H.part = onlinePlayers().map(p => p.pid);
  H.timer = setTimeout(() => hostReveal("time"), H.deadline - Date.now() + 400);
  hostPublish();
}
function hostAnswer(pid, c) {
  const H = S.host;
  if (!H || H.ph !== "q" || H.answers[pid] || !(c >= 0 && c <= 3)) return false;
  const now = Date.now();
  if (now < H.startAt || now > H.deadline + 600) return false;
  H.answers[pid] = { c, ms: now - H.startAt };
  if (!H.part.includes(pid)) H.part.push(pid);
  ensureScores();
  return true;
}
function hostCollect() {
  const H = S.host;
  if (!H) return;
  let changed = false;
  if (H.ph === "q") {
    for (const p of onlinePlayers()) {
      const a = p.peer?.presence?.ans;
      if (a && a.g === H.id && a.i === H.i && hostAnswer(p.pid, a.c)) changed = true;
    }
    const online = onlinePlayers().map(p => p.pid);
    if (online.length && online.every(id => H.answers[id])) return hostReveal("all");
  }
  // nomes novos entram no placar
  const before = Object.keys(H.sc).length; ensureScores();
  if (changed || Object.keys(H.sc).length !== before) hostPublish();
}
function hostReveal(reason) {
  const H = S.host;
  if (!H || H.ph !== "q") return;
  clearTimeout(H.timer);
  const part = H.part.filter(id => H.sc[id]);
  H.res = scoreRound(H.q, H.set.seconds * 1000, H.answers, part, H.streaks);
  for (const [id, r] of Object.entries(H.res)) {
    const s = H.sc[id];
    s[2] += r[1]; s[3] = H.streaks[id] || 0; if (r[1] > 0) s[4]++;
  }
  H.reason = reason; H.ph = "r";
  H.advAt = Date.now() + REVEAL_MS;
  H.timer = setTimeout(hostNext, REVEAL_MS);
  hostPublish();
}
function hostPublish() {
  const H = S.host, now = Date.now();
  const g = { id: H.id, t: H.t, v: ++H.v, ph: H.ph, n: H.list.length, i: H.i, dur: H.set.seconds, mode: H.set.mode, sc: H.sc };
  if (H.ph !== "f") Object.assign(g, { p: H.q.pi, o: H.q.o, x2: H.q.x2 });
  if (H.ph === "q") Object.assign(g, { st: Math.max(0, H.startAt - now), rem: H.deadline - now, ans: Object.keys(H.answers) });
  if (H.ph === "r") Object.assign(g, { c: H.q.c, res: H.res, why: H.reason, adv: H.advAt - now, nx: H.list[H.i + 1] ?? null });
  setPresence({ g });
  receiveGame(g, null);
}

function countUpScores() {

    const t0 = performance.now(), dur = 900;
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  // FLIP: começa na ordem antiga e desliza pra nova
  const lines = [...document.querySelectorAll("#board .line")];
  const old = [...lines].sort((a, b) => Number($(".score", b).dataset.from) - Number($(".score", a).dataset.from));
  const hgt = lines[0]?.getBoundingClientRect().height + 6 || 0;
  lines.forEach((el, newIdx) => {
    const oldIdx = old.indexOf(el);
    if (oldIdx === newIdx) return;
    el.style.transition = "none"; el.style.transform = `translateY(${(oldIdx - newIdx) * hgt}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = ""; el.style.transform = ""; }));
  });
}
